[project]
name = "rhetor-backend"
version = "0.1.0"
description = "Backend for Rhetor — the StudyApp where you learn by teaching."
requires-python = ">=3.11,<3.13"
readme = "../README.md"

# Dependencies are added per-step so we don't bloat the install upfront.
# Step 2 (FastAPI skeleton) adds: fastapi, uvicorn, pydantic-settings, structlog
# Step 5 (Whisper)             adds: faster-whisper
# Step 6 (LLM)                 adds: mlx-lm
# Step 7 (PDF + embeddings)    adds: pymupdf, sentence-transformers
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Lint / format ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pragmatic starter set: pycodestyle, pyflakes, isort, bugbear, simplify, comprehensions.
select = ["E", "F", "I", "B", "SIM", "C4", "UP"]
ignore = ["E501"]  # line length handled by formatter

# --- Type-check ---
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# --- Tests ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
